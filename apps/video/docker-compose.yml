services:
  # ─────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bazzy_video
      POSTGRES_USER: bazzy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazzy -d bazzy_video"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────
  # Kafka + Zookeeper (event streaming)
  # ─────────────────────────────────────────────
  zookeeper:
    profiles: ["prod"]   # not used by the app code yet
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  kafka:
    profiles: ["prod"]   # not used by the app code yet
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ─────────────────────────────────────────────
  # FastAPI backend
  # ─────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bazzy:${POSTGRES_PASSWORD:-changeme_in_prod}@postgres:5432/bazzy_video
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SEED_DEMO: ${SEED_DEMO:-true}   # loads demo catalog into an empty database
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - media_uploads:/tmp/bazzy_uploads

  # ─────────────────────────────────────────────
  # Celery worker (transcode + algo jobs)
  # ─────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bazzy:${POSTGRES_PASSWORD:-changeme_in_prod}@postgres:5432/bazzy_video
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - media_uploads:/tmp/bazzy_uploads
    # FFmpeg available via ubuntu base image
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  # ─────────────────────────────────────────────
  # Celery Beat scheduler (nightly algo recalc)
  # ─────────────────────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: celery -A app.workers.transcode_worker beat --loglevel=info
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bazzy:${POSTGRES_PASSWORD:-changeme_in_prod}@postgres:5432/bazzy_video
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on: [redis]

  # ─────────────────────────────────────────────
  # Next.js frontend
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1   # same-origin; Next proxies to the api container
        API_INTERNAL_URL: http://api:8000
        NEXT_PUBLIC_STRIPE_PK: ${STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_STRIPE_CONNECT_CLIENT_ID: ${STRIPE_CONNECT_CLIENT_ID}
        NEXT_PUBLIC_BAZZY_LIVE_URL: ${NEXT_PUBLIC_BAZZY_LIVE_URL:-https://live.bazzy.tv}
        NEXT_PUBLIC_BAZZYBOX_URL: ${NEXT_PUBLIC_BAZZYBOX_URL:-https://box.bazzy.tv}
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on: [api]

  # ─────────────────────────────────────────────
  # Bazzy Live: its own site on the same API, database and wallet,
  # plus MediaMTX, which takes the ATEM's RTMP feed and serves HLS.
  # ─────────────────────────────────────────────
  mediamtx:
    image: bluenviron/mediamtx:1.9.3-ffmpeg   # -ffmpeg variant has wget for the hooks
    restart: unless-stopped
    environment:
      # Settings live in ../live/mediamtx/mediamtx.yml; only the secret-bearing ones are here
      MTX_AUTHHTTPADDRESS: http://api:8000/api/v1/live/ingest/auth?secret=${MEDIAMTX_HOOK_SECRET}
      MEDIAMTX_HOOK_SECRET: ${MEDIAMTX_HOOK_SECRET}   # read by the hook scripts
    ports:
      - "1935:1935"   # RTMP: the ATEM streams here
      - "8888:8888"   # HLS (the Live site proxies /hls here; open for testing)
    volumes:
      - ../live/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ../live/mediamtx/hooks:/hooks:ro
      - live_recordings:/recordings
    depends_on: [api]

  live-web:
    build:
      context: ../live/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1   # same-origin; Next proxies to the shared api
        API_INTERNAL_URL: http://api:8000
        MEDIAMTX_INTERNAL_URL: http://mediamtx:8888   # /hls/* is proxied here
        NEXT_PUBLIC_STRIPE_PK: ${STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_STRIPE_CONNECT_CLIENT_ID: ${STRIPE_CONNECT_CLIENT_ID}
        NEXT_PUBLIC_BAZZY_TV_URL: ${PUBLIC_URL:-http://localhost:3000}
    restart: unless-stopped
    env_file: .env
    ports:
      - "3001:3000"   # 3000 is Bazzy TV's
    depends_on: [api]

  # ─────────────────────────────────────────────
  # Nginx reverse proxy
  # ─────────────────────────────────────────────
  nginx:
    profiles: ["prod"]   # needs SSL certs in infrastructure/nginx/ssl
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on: [api, frontend]

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  zookeeper_log:
  media_uploads:
  live_recordings:
