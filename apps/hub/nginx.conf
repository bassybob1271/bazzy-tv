# Serves the bazzy.tv landing page (this folder) behind the Cloudflare tunnel.
# Fallback only: box.bazzy.tv now goes straight to BazzyBox (deploy/mac-mini/box-on-bazzy-tv.sh). This redirect applies if the tunnel still points box at the hub.
server {
    listen 80;
    server_name box.bazzy.tv;
    return 302 https://box.bazzy.io$request_uri;
}

server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;
    location ~ /(README\.md|nginx\.conf)$ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
