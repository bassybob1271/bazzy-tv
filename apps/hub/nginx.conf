# Serves the bazzy.tv landing page (this folder) behind the Cloudflare tunnel.
# box.bazzy.tv forwards to BazzyBox on box.bazzy.io until Box itself moves to bazzy.tv.
server {
    listen 80;
    server_name box.bazzy.tv;
    return 302 https://box.bazzy.io$request_uri;
}

server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;
    location ~ /(README\.md|nginx\.conf)$ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
